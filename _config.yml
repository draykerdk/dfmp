# The Drayker documentation theme — one layout shared by every *.drayker.org site.
# Source: https://github.com/draykerdk/drayker-theme
remote_theme: draykerdk/drayker-theme

plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter

title: DFMP
description: The distributed function modularization / modeling protocol — the paradigm Drayker's projects and motions for resolution are built with.

dk_kicker: Protocol
dk_subdomain: dfmp.drayker.org
dk_repo: https://github.com/draykerdk/dfmp

defaults:
  - scope:
      path: ""
    values:
      layout: default
